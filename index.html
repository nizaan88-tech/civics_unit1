['🏛️','ஒற்றையாட்சி அரசு',['சட்டவாக்கம், நிறைவேற்று, நீதி அதிகாரங்கள் ஒரு மத்திய அரசிடம் குவிந்திருக்கும்','சில அதிகாரங்கள் உள்ளூராட்சிக்குப் பரவலாக்கப்பட்டாலும் மத்திய அரசு மீளப் பெறலாம்','எ.கா: இலங்கை, ஐக்கிய இராச்சியம், பிரான்ஸ்']],
['🗺️','கூட்டாட்சி / சமஷ்டி அரசு',['மத்திய, மாநில அரசுகளிடையே அரசியலமைப்பின் மூலம் அதிகாரப் பகிர்வு','எழுதப்பட்ட அரசியலமைப்பு; விளக்கமளிக்கும் அதிகாரம் உயர் நீதிமன்றத்திடம்','சட்டவாக்கத்துறையில் மேலவை (எ.கா: அமெரிக்க செனட்)','எ.கா: அமெரிக்கா, சுவிட்சர்லாந்து, இந்தியா, ஆஸ்திரேலியா']]]},
{t:'7. அரசாங்க கட்டமைப்பும் அதன் தொழிற்பாடுகளும்',sep:{0:'VS'},big:1,it:[
['🏛️','பாராளுமன்ற அரசாங்க முறை',['நிறைவேற்றுத்துறை உறுப்பினர்கள் பாராளுமன்றப் பிரதிநிதிகளிலிருந்தே தெரிவு','பாராளுமன்றத்திற்குப் பொறுப்புக்கூற வேண்டும்','பெயரளவு நிர்வாகி (அரசர்/ஜனாதிபதி) + உண்மை நிர்வாகி (பிரதமர், அமைச்சரவை)','எ.கா: பிரித்தானியா']],
['🧑‍⚖️','ஜனாதிபதி அரசாங்க முறை',['நிறைவேற்று அதிகாரம் ஜனாதிபதியிடம்','ஜனாதிபதி அரச தலைவரும் அரசாங்கத் தலைவரும்','பாராளுமன்றத்திற்கு நேரடியாகப் பொறுப்புக்கூற வேண்டியதில்லை','எ.கா: ஐக்கிய அமெரிக்கா']]]},

['⚖️','சமத்துவம்',['சமத்துவம் எனும் மூலக்கோட்பாட்டைப் பாதுகாத்தல்']],
['📜','அரசியலமைப்பு',['அரசியலமைப்பிற்கு அமைவாகத் தொழிற்படுதல்']],
['🔎','சட்டமும் நியாயமும்',['சட்டத்தினையும் நியாயத்தினையும் பேணல்']],
['🌾','வளப் பகிர்வு',['நாட்டின் வளங்களை நியாயமாகப் பகிர்ந்தளித்தல்']],
['💡','வெளிப்படைத்தன்மை',['அரச நிதியைப் பயன்படுத்தும்போது வெளிப்படைத்தன்மையைப் பேணல்']],
['🤝','சமூகப் பாதுகாப்பு',['சமூகப் பாதுகாப்பையும் நலன்களையும் பேணல்']],
['🌳','சுற்றாடல்',['சுற்றாடலைப் பாதுகாத்துப் பராமரித்தல்']]]},
{t:'10. சனநாயக ஆட்சி முறை வெற்றிபெற அவசியமான காரணிகள்',it:[
['🗳️','நியாயமான தேர்தல்',['சர்வஜன வாக்குரிமை மூலம் தடையின்றி வாக்களித்தல்','அனைத்து அரசியல் குழுக்களுக்கும் சம வாய்ப்பு']],
['⚖️','சட்டத்தின் ஆட்சி, நீதித்துறை சுதந்திரம்',['நீதித்துறை நடுநிலையாகவும் சுயாதீனமாகவும் தொழிற்படுதல்']],
['🧠','அரசியல் அறிவுள்ள மக்கள்',['தகுதியான தலைவர்களைத் தெரிவுசெய்யப் போதுமான அரசியல் தெளிவு']],

['🍎','தனிமனித அபிவிருத்தி',['உணவு, உடை, உறைவிடம், கல்வி, சுகாதாரம் போன்றவற்றை மேம்படுத்தல்']],
['🤲','சமூக நலனோம்பல்',['வாழ்க்கைத்தரத்தை உயர்த்த அரசு நலன்புரிச் செயற்பாடுகளில் ஈடுபடுதல் (கல்வி, சுகாதாரம், வீடமைப்பு, வறுமை ஒழிப்பு)']]]}
];
var n=0,seen={};
var $=function(i){return document.getElementById(i)};
function show(i){
  n=Math.max(0,Math.min(S.length-1,i));var s=S[n];
  $('t').textContent=s.t;
  var h='',d=0;
  s.it.forEach(function(it,k){
    var key=n+'-'+k;
    h+='<button class="tile'+(s.big?' big':'')+(seen[key]?' seen':'')+'" style="--c:'+COL[k%6]+';--d:'+(d+=.12).toFixed(2)+'s" data-k="'+k+'"><span class="ic">'+it[0]+'</span>'+it[1]+'</button>';
    if(s.sep&&s.sep[k]){h+='<span class="sep" style="--d:'+(d+=.12).toFixed(2)+'s">'+s.sep[k]+'</span>'}
  });
  $('g').innerHTML=h;
  $('hint').textContent='👆 ஒவ்வொன்றையும் தொடுங்கள் ('+s.it.filter(function(_,k){return seen[n+'-'+k]}).length+'/'+s.it.length+')';
  var dots='';for(var i2=0;i2<S.length;i2++)dots+='<i data-n="'+i2+'"'+(i2==n?' class="on"':'')+'></i>';
  $('dots').innerHTML=dots;
  $('pv').disabled=n==0;$('nx').disabled=n==S.length-1;
  $('stage').scrollTop=0;
}
function open_(k){
  var it=S[n].it[k];seen[n+'-'+k]=1;
  var c=COL[k%6];$('card').style.setProperty('--c',c);
  $('ci').textContent=it[0];$('ch').textContent=it[1];
  $('cl').innerHTML=it[2].map(function(l,j){return '<li style="animation-delay:'+(j*.12)+'s">'+l.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</li>'}).join('');
  $('pop').classList.add('show');
}
function close_(){$('pop').classList.remove('show');show(n)}
$('g').addEventListener('click',function(e){var b=e.target.closest('.tile');if(b)open_(+b.dataset.k)});
$('pop').addEventListener('click',function(e){if(e.target.id=='pop'||e.target.id=='x')close_()});
$('pv').onclick=function(){show(n-1)};$('nx').onclick=function(){show(n+1)};
$('dots').addEventListener('click',function(e){if(e.target.dataset.n)show(+e.target.dataset.n)});
document.addEventListener('keydown',function(e){
  if(e.key=='Escape')close_();
  else if(!$('pop').classList.contains('show')){if(e.key=='ArrowRight')show(n+1);if(e.key=='ArrowLeft')show(n-1)}
});
var x0=null;
document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){
  if(x0===null||$('pop').classList.contains('show'))return;
  var dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)>70)show(n+(dx<0?1:-1));
},{passive:true});
function fit(){
  var w=innerWidth,h=innerHeight,por=w/h<1,W=por?1080:1920,H=por?1920:1080,k=Math.min(w/W,h/H),cv=$('cv');
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.style.transform='translate('+(-W*k/2)+'px,'+(-H*k/2)+'px) scale('+k+')';
}
addEventListener('resize',fit);fit();
show(0);
</script>

</html>
